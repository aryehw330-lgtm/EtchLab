<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign-up</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0910; color: #fff;
      font-family: -apple-system, Helvetica, Arial, sans-serif; }
    #msg { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 20px; }
    #app { position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: 0; display: none; }
  </style>
</head>
<body>
  <div id="msg">Loading...</div>
  <iframe id="app" name="app" title="Sign-up"></iframe>
  <script>
    // The one file you edit is link.txt. This page shows the sign-up INSIDE
    // itself (full-screen frame) instead of sending the tablet to Google's
    // address, which hides Google's "created by a Google Apps Script user" bar.
    // The sign-up page, opened with ?embed=1, asks this page (postMessage) to
    // load its next screen (after Submit, "Submit another item", "Check your
    // spot") in the same frame, so the tablet never leaves this page.
    var BASE = "";
    var frame = document.getElementById("app");
    function show() { document.getElementById("msg").style.display = "none"; frame.style.display = "block"; }

    window.addEventListener("message", function (ev) {
      var d = ev.data;
      if (!d || d.lnh !== 1 || !BASE) return;
      var u, b;
      try { u = new URL(d.action); b = new URL(BASE); } catch (x) { return; }
      // Only ever load the event's own sign-up address (set in link.txt).
      if (u.origin + u.pathname !== b.origin + b.pathname) return;
      u.searchParams.set("embed", "1");
      var fields = d.fields || [];
      if (d.method === "post") {
        var form = document.createElement("form");
        form.method = "post"; form.action = u.toString(); form.target = "app"; form.style.display = "none";
        fields.forEach(function (kv) {
          var i = document.createElement("input");
          i.type = "hidden"; i.name = kv[0]; i.value = kv[1]; form.appendChild(i);
        });
        document.body.appendChild(form);
        form.submit();
        document.body.removeChild(form);
      } else {
        fields.forEach(function (kv) { u.searchParams.set(kv[0], kv[1]); });
        frame.src = u.toString();
      }
      try { ev.source.postMessage({ lnhAck: 1 }, "*"); } catch (x) {}
    });

    fetch("link.txt?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { return r.text(); })
      .then(function (url) {
        url = url.trim();
        if (url && !/^https?:\/\//i.test(url)) { url = "https://" + url; }
        if (!url) {
          document.getElementById("msg").textContent = "No link set yet - edit link.txt on GitHub.";
          return;
        }
        BASE = url;
        var u = new URL(url);
        u.searchParams.set("embed", "1");
        frame.onload = show;
        frame.src = u.toString();
        setTimeout(show, 6000);
      })
      .catch(function () {
        document.getElementById("msg").textContent = "Couldn't load the link - check the tablet's WiFi.";
      });
  </script>
</body>
</html>
